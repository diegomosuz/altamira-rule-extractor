# PLANTILLA -- NUNCA aplicar este archivo tal cual (kubectl apply -f)
# a un cluster real.
#
# Fase 15B4-B2 (correccion de seguridad): los placeholders de
# NEO4J_PASSWORD/ALTAMIRA_SESSION_SECRET de abajo son DELIBERADAMENTE
# demasiado cortos para pasar la validacion real de cada uno --
# aplicar este archivo sin reemplazarlos NO deja el sistema
# silenciosamente inseguro, lo hace FALLAR VISIBLEMENTE:
#   - NEO4J_PASSWORD (7 caracteres): la imagen oficial de Neo4j exige
#     un minimo de 8 y se niega a arrancar (Neo4j queda en
#     CrashLoopBackOff, visible con `kubectl get pods`).
#   - ALTAMIRA_SESSION_SECRET (27 caracteres): el validador eager de
#     Settings (config.py::_check_session_secret_minimum_length)
#     exige un minimo de 32 y la app entera falla al arrancar
#     (tambien CrashLoopBackOff) -- NUNCA arranca con un secreto de
#     firma de sesion predecible.
# Esto es intencional: preferible un fallo de arranque obvio a un
# password/secreto "tecnicamente valido" pero publico/adivinable
# quedando activo sin que nadie lo note.
#
# Procedimiento: copiar este archivo fuera de control de versiones,
# reemplazar TODOS los placeholders con valores reales generados
# (nunca acortar la regla de arriba en sentido inverso), y aplicar la
# copia -- nunca commitear el archivo con valores reales (mismo
# principio que .env, ver .gitignore/.dockerignore de la raiz del
# repo).
#
# Secrets minimos por perfil (ver docs/release/RELEASE_PROFILES.md,
# "Security Profile" -- LA AUTENTICACION ES INDEPENDIENTE DEL PERFIL
# DETERMINISTIC_OFFLINE/FULL_LLM: ambos requieren exactamente los
# mismos secretos de abajo, "offline" nunca significa "sin
# autenticacion"):
#   base (siempre): NEO4J_PASSWORD, ALTAMIRA_SESSION_SECRET,
#   SECURITY_YAML (bloque completo, ver mas abajo).
#   FULL_LLM ademas: la api_key del proveedor elegido (OPENAI_API_KEY
#   o PWC_GENAI_API_KEY -- nunca ambas a la vez).
apiVersion: v1
kind: Secret
metadata:
  name: altamira-secrets
  namespace: altamira-rule-extractor
type: Opaque
stringData:
  # DELIBERADAMENTE 7 caracteres (< 8, ver docstring de arriba).
  # Debe coincidir exactamente con el valor usado por NEO4J_AUTH en
  # neo4j-statefulset.yaml (mismo Secret, misma clave -- ver ese
  # archivo).
  NEO4J_PASSWORD: "REPLACE"

  # DELIBERADAMENTE 27 caracteres (< 32, ver docstring de arriba).
  # HMAC de firma de sesion/CSRF (security/session.py). Generar con,
  # por ejemplo,
  # `python -c "import secrets; print(secrets.token_hex(32))"` -- NUNCA
  # reutilizar un valor de ejemplo/documentacion. Rotar este valor
  # invalida TODAS las sesiones activas de inmediato (ver
  # docs/REVERSE_PROXY_SECURITY_REQUIREMENTS.md, requisito 13).
  # Obligatorio siempre en este release (authentication_mode=
  # TRUSTED_PROXY_HEADERS por defecto, ver security.yaml mas abajo).
  ALTAMIRA_SESSION_SECRET: "REPLACE_ME_BEFORE_DEPLOYING"

  # --- Perfil FULL_LLM unicamente -- descomentar UNA de las dos ---
  # (nunca ambas: LLM_PROVIDER selecciona cual perfil se resuelve, ver
  # docs/release/RELEASE_PROFILES.md). En perfil DETERMINISTIC_OFFLINE
  # dejar ambas ausentes/comentadas -- ninguna etapa determinista las
  # requiere (ver pipeline/llm_client.py::resolve_llm_profile).
  # OPENAI_API_KEY: "REPLACE_WITH_REAL_OPENAI_KEY"
  # PWC_GENAI_API_KEY: "REPLACE_WITH_REAL_PWC_GATEWAY_KEY"

  # config/security.yaml (Fase 15B1, corregido Fase 15B4-B2): OBLIGATORIO
  # -- su ausencia deja /ready en 503 permanente
  # (security_misconfigured). Vive en ESTE Secret (no en
  # configmap.yaml) porque, en TRUSTED_PROXY_HEADERS,
  # trusted_proxy_required_marker_value es un secreto real -- el
  # loader carga el archivo como una unidad, nunca fusiona
  # ConfigMap+Secret.
  #
  # authentication_mode=TRUSTED_PROXY_HEADERS es el default de ESTE
  # release (K3s) -- DISABLED_DEV queda reservado exclusivamente para
  # desarrollo local (ver config/security.example.yaml, nunca usado
  # por estos manifests). session_cookie_secure=true asume que el
  # reverse proxy del cliente termina TLS (ver
  # docs/REVERSE_PROXY_SECURITY_REQUIREMENTS.md, requisito 3).
  #
  # trusted_proxy_header_user/email/groups: nombres de header (no
  # secretos) que el proxy del cliente debe enviar ya verificados --
  # ajustar si el proxy real usa nombres distintos a estos defaults.
  # trusted_proxy_required_marker_value: SECRETO real compartido
  # unicamente entre el proxy y esta app (nunca el mismo valor que
  # ALTAMIRA_SESSION_SECRET) -- si se deja el placeholder de abajo,
  # el mecanismo de comparacion constante-en-tiempo
  # (security/identity_resolver.py, hmac.compare_digest) SIEMPRE
  # rechaza el request como no autenticado (falla cerrado, nunca
  # concede acceso anonimo) hasta que el operador configure el MISMO
  # valor en el proxy y aqui.
  # trusted_proxy_allowed_roles/group_role_mapping: vacios por
  # defecto (ningun grupo obtiene privilegio elevado hasta que el
  # operador los complete explicitamente -- default seguro, nunca
  # ADMIN/OPERATOR por accidente).
  security.yaml: |
    schema_version: "1.0"
    authentication_mode: TRUSTED_PROXY_HEADERS

    trusted_proxy_header_user: "X-Altamira-Verified-User"
    trusted_proxy_header_email: "X-Altamira-Verified-Email"
    trusted_proxy_header_groups: "X-Altamira-Verified-Groups"
    trusted_proxy_required_marker_header: "X-Altamira-Trusted-Proxy"
    trusted_proxy_required_marker_value: "REPLACE_WITH_SHARED_PROXY_MARKER"

    trusted_proxy_allowed_roles: []
    group_role_mapping: {}
    default_authenticated_role: VIEWER

    session_cookie_name: "altamira_session"
    session_cookie_secure: true
    session_cookie_httponly: true
    session_cookie_samesite: strict
    csrf_enabled: true
    csrf_token_ttl_seconds: 3600
    session_ttl_seconds: 28800

    require_distinct_reviewer_for_primary: true
    require_distinct_reviewer_for_rollback: false

    audit_enabled: true
    diagnostics: []

- case_id: gt-positive-by-reference-output-unconditional-move
  kind: POSITIVE
  program: GTBRCLR1
  fixtures:
  - relative_path: config/ground_truth/fixtures/gt_by_reference_output_callee_001.cbl
    sha256: d4db8a7994ae649e010e01647b1f04e9a383fc907ee6f78bbb53eb356a84ab8d
  - relative_path: config/ground_truth/fixtures/gt_by_reference_output_caller_001.cbl
    sha256: 19b5352db448eefe16f57f846fd046d92a79deb355421082812c86170f2a5fa9
  description: 'GTBRCLR1 (caller) invoca CALL ''GTBRCLE1'' USING BY REFERENCE WS-STATUS;
    GTBRCLE1 (callee) ejecuta MOVE ''OK00'' TO LK-STATUS de forma UNCONDICIONAL (unico statement
    de MAIN-PARA, sin IF/EVALUATE) antes de GOBACK -- caso interprocedural genuino: dos
    programas, dos fixtures.'
  expected_rules:
  - expectation_id: gt-positive-by-reference-output-unconditional-move::interprocedural-by-reference
    rule_family: BY_REFERENCE_OUTPUT
    paragraph: MAIN-PARA
    minimum_count: 1
    derivation_notes: 'detect_by_reference_rule exige exit_fact status=PROPAGATED
      (_exit_fact_for_binding -> _known_literal_at con parent_scope=None): busca el ULTIMO
      PropagatedValueFact de GTBRCLE1 escrito a LK-STATUS fuera de cualquier decision. La unica
      escritura es MOVE ''OK00'' TO LK-STATUS, top-level en MAIN-PARA -- produce un unico fact
      literal, exit_fact queda PROPAGATED con literal=''OK00''. callee_exit_barrier=None (GOBACK
      nunca es barrera). binding RESOLVED_POSITIONAL (unico parametro LINKAGE). Mapeo
      BY_REFERENCE_RULE -> BY_REFERENCE_OUTPUT via candidate_source_adapters.py,
      program=caller_program, paragraph=caller_paragraph. Confirmado end-to-end con el pipeline
      real hasta PARSED + compute_interprocedural_rule_candidates_artifact (sin Neo4j): 1
      candidato support=DETERMINISTIC caller=GTBRCLR1 callee=GTBRCLE1 target=WS-STATUS
      output_literal=OK00, sin barriers ni diagnostics.'
- case_id: gt-positive-calculation-if-compute-multiplication
  kind: POSITIVE
  program: GTCALC001
  fixtures:
  - relative_path: config/ground_truth/fixtures/gt_calculation_001.cbl
    sha256: 4c5810841ee6bcefc55e98e5e45bf68b92204156f55288ccc12083fcc2a29c8b
  description: 'IF WS-TIPO = ''I'' COMPUTE WS-COMISION = WS-MONTO * WS-TASA END-IF:
    calculo condicionado (Fase 15B3-C2-B1) -- COMPUTE dentro de un IF produce un
    unico CALCULATION_RULE anclado a esa Decision.'
  expected_rules:
  - expectation_id: gt-positive-calculation-if-compute-multiplication::v2-calculation
    rule_family: CALCULATION
    paragraph: MAIN-PARA
    minimum_count: 1
    derivation_notes: 'pipeline/v2_detectors.py::detect_calculation itera SemanticEffects
      de kind=COMPUTE_VALUE (un unico normalizador para COMPUTE/ADD/SUBTRACT/MULTIPLY/DIVIDE,
      semantic_effects_analyzer._normalize_calculation) y exige un IF/EVALUATE envolvente via
      _nearest_enclosing_decision (reutilizado sin cambios) -- el COMPUTE esta anidado dentro
      del IF, decision_id resuelve contra el Decision real. support=PARTIAL (nunca
      DETERMINISTIC: su validador exige resolved_literal, y una formula nunca tiene un
      literal) reinterpretado localmente como "formula probada, valor runtime no evaluado".
      enhanced_candidate_integration.py promueve a RuleCandidate(rule_family=CALCULATION) SIN
      gate de semantic_tag. Confirmado con el JAR real: target_data_items=[WS-COMISION],
      parent_statement_id apunta al IF, unsupported_constructs=[].'
- case_id: gt-positive-calculation-unconditional-compute-multiplication
  kind: POSITIVE
  program: GTCALC002
  fixtures:
  - relative_path: config/ground_truth/fixtures/gt_calculation_unconditional_001.cbl
    sha256: 55eb5b549e8acbc0480967fdc44ada58787639e47271b42d841c5b73c70fea86
  description: 'COMPUTE WS-COMISION = WS-MONTO * WS-TASA, unico statement de MAIN-PARA,
    SIN IF/EVALUATE envolvente: calculo incondicional (Fase 15B3-C2-B2) produce un
    CALCULATION_RULE con decision_id=None/condition=None.'
  expected_rules:
  - expectation_id: gt-positive-calculation-unconditional-compute-multiplication::v2-calculation
    rule_family: CALCULATION
    paragraph: MAIN-PARA
    minimum_count: 1
    derivation_notes: 'pipeline/v2_detectors.py::detect_calculation itera SemanticEffects
      de kind=COMPUTE_VALUE (mismo normalizador que el caso condicionado) --
      _nearest_enclosing_decision(...) devuelve None (COMPUTE es el unico statement de
      MAIN-PARA, sin IF/EVALUATE ancestro), asi que decision_id=None en el
      V2ShadowCandidate. Desde 15B3-C2-B2, enhanced_candidate_integration.py ya NO
      descarta este caso: _convert_unconditional_calculation (camino dedicado, nunca
      _convert_v2_candidate) lo productiviza a RuleCandidate(rule_family=CALCULATION,
      decision_id=None, condition=None) usando unicamente el nodo Paragraph real
      (line_start/source_file) mas la formula/target ya demostrados por el
      SemanticEffect COMPUTE_VALUE -- nunca fabrica una Decision ni una condition
      sintetica. Confirmado con el JAR real: target_data_items=[WS-COMISION],
      parent_statement_id=None, unsupported_constructs=[].'

      parse): condition_name_target=COD-OPERACION-VALIDA, condition_set_value=true,
      parent_statement_id apunta al IF, condition_names[...].values tiene un unico elemento.'
- case_id: gt-positive-return-code-if-else
  kind: POSITIVE
  program: GTRC001
  fixtures:
  - relative_path: config/ground_truth/fixtures/gt_return_code_001.cbl
    sha256: fc64626ecaf91901bd6983476dfd6fa0053e113bd8f9834509d9f011d537e582
  description: 'IF WS-MONTO > 1000 MOVE 99 TO WS-COD-RETORNO ELSE MOVE 0 TO WS-COD-RETORNO:
    decision IF cuyas dos ramas escriben un DataItem taggeado return_code.'
  expected_rules:
  - expectation_id: gt-positive-return-code-if-else::q0
    rule_family: RETURN_CODE
    paragraph: MAIN-PARA
    minimum_count: 1
    derivation_notes: 'WS-COD-RETORNO coincide con la regla return-code-name de
      config/semantic-tags.yml ((?i).*(COD|CODE).*(RET|RETURN|RESP).*: contiene
      "COD" seguido de "RETORNO", que contiene "RET"). semantic_graph_builder.py
      construye Decision+LEADS_TO unicamente desde IF/EVALUATE, con LEADS_TO hacia
      los DataItem escritos en las ramas (ver notas de construct_id=IF en
      config/semantic_coverage.yaml). queries/v1/q0_candidates.cypher exige
      exactamente Program-[:CONTAINS]->Paragraph-[:HAS_DECISION]->Decision-[:LEADS_TO]->DataItem
      con DataItem.semantic_tag=''return_code'' -- ambas ramas de este IF satisfacen
      ese patron para WS-COD-RETORNO, por lo que Q0 (detector_id=q0-return-code-decision)
      debe producir al menos una fila. Confirmado con el JAR real de ProLeap (parser/target/
      altamira-cobol-parser.jar parse): ambos MOVE (branch=THEN/ELSE) declaran
      target_data_items=[WS-COD-RETORNO] con parent_statement_id apuntando al mismo IF, y
      unsupported_constructs=[] (sin degradacion de extraccion).'
- case_id: gt-positive-state-transition-if-status-target
  kind: POSITIVE
  program: GTST001
  fixtures:
  - relative_path: config/ground_truth/fixtures/gt_state_transition_001.cbl
    sha256: 3103ed4d60be693aed1ad5a473bb8641b09c6597e485065d77afc0a994cafa6a
  description: 'IF WS-SALDO < WS-MONTO MOVE ''R'' TO WS-ESTADO-OPERACION END-IF: decision
    IF cuya unica rama escribe un DataItem taggeado status (Fase 15B3-C1,
    config/semantic-tags.yml regla status-name).'
  expected_rules:
  - expectation_id: gt-positive-state-transition-if-status-target::v2-state-change
    rule_family: STATE_TRANSITION
    paragraph: MAIN-PARA
    minimum_count: 1
    derivation_notes: 'pipeline/v2_detectors.py::detect_state_change detecta la escritura
      deterministica (MOVE literal, DIRECT_LITERAL) de WS-ESTADO-OPERACION dentro de la
      decision -- support=PARTIAL siempre (Fase 7, sin evaluar relevancia funcional).
      pipeline/enhanced_candidate_integration.py (Fase 15B3-C1) promueve a
      RuleCandidate(rule_family=STATE_TRANSITION) UNICAMENTE porque
      WS-ESTADO-OPERACION matchea la regla status-name de config/semantic-tags.yml
      (correccion pre-commit 15B3-C1: contiene "-ESTADO" como palabra completa
      delimitada por guiones, sin ir seguida de "-FLAG" y sin estar precedida de
      "IND"/"INDICADOR" -- ese ultimo lookbehind negativo es lo que hace que
      status-name y status-flag-name sean mutuamente NO ambiguas) -- semantic_tag=status.
      Sin ese semantic_tag, V2_STATE_CHANGE nunca se promueve (permanece UNKNOWN/shadow,
      ver gt-negative-state-transition-nonfunctional-indicator-name). No usa LLM ni
      heuristica de texto libre: unicamente el semantic_tag ya asignado por SemanticTagger.'

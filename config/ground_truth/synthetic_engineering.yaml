  program: GTL88001
  fixtures:
  - relative_path: config/ground_truth/fixtures/gt_level88_return_code_001.cbl
    sha256: 4eb7f6772a35b59821e5c2c69f3adcb629c0c46f5bc9075cf204fa89ab20f325
  description: 'IF WS-MONTO > 1000 SET COD-OPERACION-VALIDA TO TRUE END-IF: SET de
    una condicion-88 anidado DENTRO de la rama de un IF (a diferencia del fixture
    del parser Java parser/src/test/resources/fixtures/level-88.cbl, cuyos SET estan
    al nivel de MAIN-PARA, fuera de cualquier decision).'
  expected_rules:
  - expectation_id: gt-positive-level88-return-code-nested-set::v2-level88
    rule_family: LEVEL_88_RETURN_CODE
    paragraph: MAIN-PARA
    minimum_count: 1
    derivation_notes: 'pipeline/v2_detectors.py::detect_level_88_return_code (lineas 363-454)
      exige: (a) kind=SET con condition_name_target/condition_set_value=True; (b) un
      SemanticEffectKind.SET_CONDITION_TRUE demostrado; (c) decision_statement=
      _nearest_enclosing_decision(...) no nulo [SET anidado dentro del IF, a diferencia de
      level-88.cbl]; (d) CONDITION_LITERAL resuelto contra un unico VALUE [COD-OPERACION-VALIDA
      tiene solo ''0000'', sin THRU ni multiples valores -- a diferencia de COD-RANGO-ERROR/

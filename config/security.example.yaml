# Ejemplo SEGURO de config/security.yaml (Fase 15B1).
#
# Este archivo se versiona; config/security.yaml (el archivo REAL que
# la aplicacion carga en produccion) NUNCA se versiona y NUNCA existe
# en este repositorio.
#
# CORRECCION (Fase 15B4-B, "cierre Fase 15B1" ya cambio este
# comportamiento y este archivo habia quedado desactualizado): la
# AUSENCIA de config/security.yaml, o un archivo presente pero
# invalido, YA NO resuelve en silencio a DISABLED_DEV -- deja
# `app.state.security_misconfigured=True`, `/health` sigue en 200 pero
# `/ready` falla (503, reason=security_misconfigured) y ninguna ruta
# que dependa de identidad/sesion entrega datos (ver
# api/app.py::create_app, security/fastapi_deps.py). Un despliegue
# real (incluyendo K3s, ver deploy/k3s/configmap.yaml) DEBE proveer un
# config/security.yaml valido -- copiar este ejemplo es la forma
# minima de arrancar en DISABLED_DEV explicito.
# `contracts/security_config.py::default_disabled_dev_security_config`
# sigue existiendo como valor por defecto tipado (usado por tests y
# como referencia de forma), pero el arranque de la app YA NO lo
# invoca automaticamente ante ausencia de archivo.
#
# Sin identidades reales. Sin emails reales. Sin secretos.

schema_version: "1.0"
authentication_mode: DISABLED_DEV

trusted_proxy_header_user: "X-Altamira-Verified-User"
trusted_proxy_header_email: "X-Altamira-Verified-Email"
trusted_proxy_header_groups: "X-Altamira-Verified-Groups"
trusted_proxy_required_marker_header: "X-Altamira-Trusted-Proxy"
# Valor de ejemplo, nunca un secreto real -- en TRUSTED_PROXY_HEADERS
# real este valor debe ser un marcador conocido unicamente por el
# proxy y la aplicacion, provisto fuera de este repositorio.
trusted_proxy_required_marker_value: "example-marker-never-use-in-production"

trusted_proxy_allowed_roles: []
group_role_mapping: {}
default_authenticated_role: VIEWER

session_cookie_name: "altamira_session"
session_cookie_secure: false
session_cookie_httponly: true
session_cookie_samesite: strict
csrf_enabled: true
csrf_token_ttl_seconds: 3600
session_ttl_seconds: 28800

require_distinct_reviewer_for_primary: true
require_distinct_reviewer_for_rollback: false

audit_enabled: true
diagnostics: []

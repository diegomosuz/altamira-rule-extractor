- construct_id: SUBTRACT
  display_name: Subtract (aritmetica sin COMPUTE)
  category: DATA_MANIPULATION
  layers:
  - layer: PROLEAP_PARSER
    status: SUPPORTED
    evidence:
    - kind: JAVA_TEST
      reference: io.proleap.cobol.asg.metamodel.procedure.subtract.SubtractStatement
      description: clase ASG real confirmada por inspeccion directa del JAR resuelto (jar tf)
  - layer: JAVA_STATEMENT_EXTRACTION
    status: SUPPORTED
    notes: 'Fase 15B3-C2-B1: StatementExtractor.convertSubtract() interpreta
      FROM/FROM...GIVING estructuralmente (kind=SUBTRACT); SUBTRACT CORRESPONDING
      permanece RECOGNIZED_NOT_INTERPRETED (ver limitations); ROUNDED/ON SIZE
      ERROR se registran via unsupported_constructs sin bloquear el camino feliz.'
    evidence:
    - kind: JAVA_TEST
      reference: parser/src/test/java/com/altamira/extractor/parser/cobol/ArithmeticStatementExtractorTest.java::subtractBasicCapturesTargetAndRead
    - kind: JAVA_TEST
      reference: parser/src/test/java/com/altamira/extractor/parser/cobol/ArithmeticStatementExtractorTest.java::subtractGivingCapturesDistinctTarget
  - layer: CANONICAL_REPRESENTATION
    status: SUPPORTED
    notes: target_data_items/variables_read estructurados; expression queda null por
      diseno, source_text preservado verbatim.
    evidence:
    - kind: JAVA_TEST
      reference: parser/src/test/java/com/altamira/extractor/parser/cobol/ArithmeticStatementExtractorTest.java
  - layer: SEMANTIC_GRAPH
    status: NOT_SUPPORTED
    notes: Sin nodo/relacion propia; ancla via el Decision existente (IF/EVALUATE)
      cuando esta condicionado, sin cambios de metamodelo.
  - layer: DATA_FLOW
    status: SUPPORTED
    notes: SemanticEffectKind.COMPUTE_VALUE (un unico normalizador compartido con
      COMPUTE/ADD/MULTIPLY/DIVIDE); propagacion se bloquea en COMPUTED_VALUE.
    evidence:
    - kind: UNIT_TEST
      reference: tests/pipeline/test_semantic_effects_analyzer.py::test_subtract_multiply_divide_all_produce_compute_value_never_a_kind_per_verb
  - layer: CONTROL_FLOW
    status: NOT_APPLICABLE
  - layer: INTERPROCEDURAL
    status: NOT_APPLICABLE
  - layer: DETECTOR
    status: PARTIALLY_SUPPORTED
    notes: 'V2_CALCULATION (detect_calculation) productiviza SUBTRACT SOLO cuando
      esta bajo Decision; un SUBTRACT incondicional queda reconocido (SemanticEffect
      COMPUTE_VALUE) pero no productivizado, con warning persistido en
      CandidateArtifact.warnings. detect_calculation no distingue StatementKind
      de origen (validado explicitamente con MULTIPLY; el mismo detector cubre
      SUBTRACT por construccion).'
    evidence:
    - kind: UNIT_TEST
      reference: tests/pipeline/test_v2_detectors.py::test_conditioned_arithmetic_verb_also_detects_calculation_candidate
  - layer: EVIDENCE
    status: PARTIALLY_SUPPORTED
    notes: Citable (evidence_ids no vacios) unicamente cuando el candidato
      CALCULATION correspondiente se productiviza (condicionado).
  - layer: PROVENANCE
    status: SUPPORTED
    notes: source_file/line_start/line_end preservados (kind=SUBTRACT, ya no OTHER).
    evidence:
    - kind: JAVA_TEST
      reference: parser/src/test/java/com/altamira/extractor/parser/cobol/ArithmeticStatementExtractorTest.java
  - layer: FUNCTIONAL_VALIDATION
    status: PARTIALLY_SUPPORTED
    notes: Ground truth sintetico cubre CALCULATION via COMPUTE
      (gt-positive-calculation-if-compute-multiplication); SUBTRACT comparte el
      mismo detector/family sin caso de ground truth dedicado a este verbo.
  java_statement_kind: SUBTRACT
  detectors:
  - detector_id: V2_CALCULATION
    rule_families:
    - CALCULATION
    notes: Condicionado -> CALCULATION productiva; incondicional -> shadow con
      decision_id=None y warning persistido.
  rule_families:
  - rule_family: CALCULATION
    status: PARTIALLY_SUPPORTED
    notes: Productiva solo condicionado (bajo Decision); incondicional reconocido
      pero no productivizado en 15B3-C2-B1.
  fixtures:
  - parser/src/test/resources/fixtures/arithmetic.cbl
  limitations:
  - Calculos incondicionales (sin Decision envolvente) no se productivizan en
    15B3-C2-B1 (diferido a 15B3-C2-B2).
  - El JAR de ProLeap expone 4 clases ASG distintas para variantes de SUBTRACT (SubtractStatementImpl,
    SubtractFromStatementImpl, SubtractFromGivingStatementImpl, SubtractCorrespondingStatementImpl, confirmadas
    por inspeccion directa del JAR); las 4 colapsan al mismo construct_id=SUBTRACT.
  - ON SIZE ERROR/NOT ON SIZE ERROR no interpretan su branch de control (el
    camino feliz aritmetico si se interpreta).
  - ROUNDED no ajusta el valor numerico (solo presencia registrada via
    unsupported_constructs).
  - SUBTRACT CORRESPONDING no se expande (RECOGNIZED_NOT_INTERPRETED);
    target_data_items queda vacio, con diagnostico explicito via
    unsupported_constructs.
  domain_reviewed: false
  diagnostics: []

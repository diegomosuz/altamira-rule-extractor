[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "altamira-rule-extractor"
version = "1.18.1"
description = "Extractor de reglas de negocio Altamira sobre paquetes COBOL y grafo semantico Neo4j"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "lxml>=5.2,<6",
    "typer>=0.12,<1",
    "PyYAML>=6.0.2,<7",
    "neo4j>=5.24,<6",
    "jsonschema>=4.18",
    "httpx>=0.27,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "jinja2>=3.1,<4",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "types-PyYAML>=6.0.2",
    "types-jsonschema>=4.18",
    "pytest-asyncio>=0.23,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
altamira_extractor = [
    "py.typed",
    "ui/templates/*.html",
    "ui/static/*.css",
    "ui/static/*.js",
    "ui/static/*.md",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Idioma obligatorio de FastAPI: Depends()/File()/Query() SIEMPRE como
# default de parametro (asi resuelve la inyeccion de dependencias). No es
# el antipatron de "default mutable" que B008 detecta en general.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Query",
    "fastapi.Form",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unused_ignores = true
namespace_packages = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "lxml.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires Docker services (Neo4j) running",
    "neo4j_integration: requires a real Neo4j server reachable via ALTAMIRA_TEST_NEO4J_* env vars",
]

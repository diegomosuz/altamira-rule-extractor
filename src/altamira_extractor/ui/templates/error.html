{% extends "base.html" %}
{% block title %}Error {{ status_code }} -- Altamira Rule Extractor{% endblock %}
{% block content %}
<div class="error-box error-status-{{ status_code }}" role="alert">
  <h1>Error {{ status_code }}</h1>
  <p class="error-code">{{ code }}</p>
  <p class="error-message">{{ message }}</p>
</div>
<p><a href="{{ url_for('ui_runs') }}">Volver al listado de runs</a></p>
{% endblock %}
